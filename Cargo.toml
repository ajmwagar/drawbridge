[workspace]
resolver = "2"
members = [
  "crates/drawbridge-core",
  "crates/drawbridge-matrix",
  "crates/drawbridge-store",
  "crates/drawbridge-appservice",
  "crates/drawbridge-host",
  "crates/drawbridge-meshcore",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/ajmwagar/drawbridge"
authors = ["Avery Wagar <ajmw.subs@gmail.com>"]

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
chacha20poly1305 = { version = "0.10", features = ["std"] }
fs2 = "0.4"
hex = "0.4"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", features = ["serde"] }

[profile.release]
lto = "thin"
strip = true
